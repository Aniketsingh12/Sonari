<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Sonari — AI Voice Agent</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2338c6ec'/%3E%3Cg fill='black'%3E%3Crect x='9' y='13' width='2.6' height='6' rx='1.3'/%3E%3Crect x='14.7' y='9' width='2.6' height='14' rx='1.3'/%3E%3Crect x='20.4' y='12' width='2.6' height='8' rx='1.3'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Figtree as a true variable font (100..900). display=block, never swap:
         the whole type system is tuned to real variable instances (470, 511,
         577…), so a synthesized fallback bold would misrender every weight. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@100..900&family=JetBrains+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <script>
      // Set theme before paint to avoid a flash of the wrong theme.
      (function () {
        var t = localStorage.getItem("vd-theme");
        var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");

        // Arm the entrance timeline before first paint. Someone who asked for
        // reduced motion never gets the pending (hidden) state at all, so the
        // page renders in its final form for them.
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.setAttribute("data-enter", "pending");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
